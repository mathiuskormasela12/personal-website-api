# Database-only Compose stack: runs just MySQL, for local development or
# when the API runs outside Docker (npm run start:dev) against it.
#
#   docker compose -f docker-compose.db.yml up -d
#
# It shares the same `db_data` volume and `${DB_*}` variables as the full
# stack in docker-compose.yml, so data created by either stack is visible
# to both. Don't run both stacks at the same time — they would claim the
# same container name.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-db-root-password}
      MYSQL_DATABASE: ${DB_NAME:-personal_website}
      MYSQL_USER: ${DB_USER:-api}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db-password}
    ports:
      # Publish MySQL so the locally-running API can reach it at
      # 127.0.0.1:${DB_PORT} (set DB_HOST=127.0.0.1 in .env).
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
