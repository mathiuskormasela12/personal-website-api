services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-db-root-password}
      MYSQL_DATABASE: ${DB_NAME:-personal_website}
      MYSQL_USER: ${DB_USER:-api}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db-password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The app reads PORT (default 9000) and listens on 0.0.0.0.
      PORT: ${PORT:-9000}
      # Inside the compose network the database is reachable as "db".
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "${PORT:-9000}:${PORT:-9000}"

volumes:
  db_data:
