services:
  personal-website-db:
    container_name: personal-website-db
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-db-root-password}
      MYSQL_DATABASE: ${DB_NAME:-personal_website}
      MYSQL_USER: ${DB_USER:-api}
      MYSQL_PASSWORD: ${DB_PASSWORD:-db-password}
    volumes:
      - personal_website_db_data:/var/lib/mysql
    networks:
     - personal_website_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  personal-website-api:
    container_name: personal-website-api
    build: .
    restart: unless-stopped
    networks:
     - personal_website_network
    depends_on:
      personal-website-db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # The app reads PORT (default 9000) and listens on 0.0.0.0.
      PORT: ${PORT:-9000}
      # Inside the compose network the database is reachable by its service name.
      DB_HOST: personal-website-db
      DB_PORT: 3306
    ports:
      - "${PORT:-9000}:${PORT:-9000}"

volumes:
  personal_website_db_data:
   name: personal_website_db_data

networks:
  personal_website_network:
   name: personal_website_network
   driver: bridge